[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-range-trader"
version = "0.2.1"
description = "A range-market detector and mean-reversion backtester for Japanese equities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jquants-api-client>=2.6,<2.7",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=18",
    "PyYAML>=6.0",
    "requests>=2.32,<3",
    "urllib3>=2,<3",
    "yfinance>=0.2.66,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live_jquants: requires RUN_LIVE_JQUANTS_TESTS=1 and JQUANTS_API_KEY",
    "live_yfinance: requires RUN_LIVE_YFINANCE_TESTS=1",
]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"reports/plotting.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "backtest*",
    "config*",
    "data*",
    "indicators*",
    "metrics*",
    "reports*",
    "risk*",
    "screening*",
    "strategy*",
    "universe*",
]
